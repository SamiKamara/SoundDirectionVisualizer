name: Bug report
description: Report a reproducible problem with capture, direction analysis, targeting, or the UI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Sound Direction Visualizer. Do not attach captured audio, private paths, account details, or game logs containing sensitive information.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Select ...
        2. Start ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Audio and display environment
      description: Include endpoint name/layout, display scaling/layout, game display mode, and whether endpoint or game-process capture was selected.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant aggregate probe output or errors after removing personal paths and identifiers. Do not upload recorded audio.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed sensitive information and did not attach captured audio.
          required: true
